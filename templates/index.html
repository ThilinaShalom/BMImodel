<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Questionnaire</title>
</head>
<body>
    <h1>Health Questionnaire</h1>
    <form action="/submit" method="post">
        <label for="question1">1. What is your age?</label>
        <input type="number" id="question1" name="question1" required><br><br>

        <label for="question2">2. What is your gender?</label>
        <select id="question2" name="question2" required>
            <option value="male">Male</option>
            <option value="female">Female</option>
            <option value="other">Other</option>
        </select><br><br>

        <label for="question3">3. What is your height (in cm)?</label>
        <input type="number" id="question3" name="question3" required><br><br>

        <label for="question4">4. What is your weight (in kg)?</label>
        <input type="number" id="question4" name="question4" required><br><br>

        <label for="question5">5. How many days a week do you exercise?</label>
        <input type="number" id="question5" name="question5" required><br><br>

        <label for="question6">6. What type of exercise do you do?</label>
        <input type="text" id="question6" name="question6" required><br><br>

        <label for="question7">7. How long do you exercise each session (in minutes)?</label>
        <input type="number" id="question7" name="question7" required><br><br>

        <label for="question8">8. Do you have any dietary restrictions?</label>
        <input type="text" id="question8" name="question8" required><br><br>

        <label for="question9">9. How many meals do you eat per day?</label>
        <input type="number" id="question9" name="question9" required><br><br>

        <label for="question10">10. How many servings of fruits and vegetables do you eat per day?</label>
        <input type="number" id="question10" name="question10" required><br><br>

        <label for="question11">11. How much water do you drink per day (in liters)?</label>
        <input type="number" id="question11" name="question11" required><br><br>

        <label for="question12">12. Do you smoke?</label>
        <select id="question12" name="question12" required>
            <option value="yes">Yes</option>
            <option value="no">No</option>
        </select><br><br>

        <label for="question13">13. Do you consume alcohol?</label>
        <select id="question13" name="question13" required>
            <option value="yes">Yes</option>
            <option value="no">No</option>
        </select><br><br>

        <label for="question14">14. How many hours of sleep do you get per night?</label>
        <input type="number" id="question14" name="question14" required><br><br>

        <label for="question15">15. Do you have any chronic illnesses?</label>
        <input type="text" id="question15" name="question15" required><br><br>

        <label for="question16">16. Are you currently taking any medications?</label>
        <input type="text" id="question16" name="question16" required><br><br>

        <label for="question17">17. Do you have any allergies?</label>
        <input type="text" id="question17" name="question17" required><br><br>

        <label for="question18">18. What is your primary health goal (e.g., weight loss, muscle gain, general fitness)?</label>
        <input type="text" id="question18" name="question18" required><br><br>

        <label for="question19">19. How would you rate your current stress level (1-10)?</label>
        <input type="number" id="question19" name="question19" required><br><br>

        <label for="question20">20. Do you have any specific health concerns or conditions?</label>
        <input type="text" id="question20" name="question20" required><br><br>

        <input type="submit" value="Submit">
    </form>
</body>
</html>
